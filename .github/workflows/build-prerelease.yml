name: Auto Build Pre-Release APK

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build Pre-Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache

      - name: Publish Pre-Release to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generiamo un tag progressivo basato sul numero della build
          TAG="v1.0.${{ github.run_number }}-beta"
          TITLE="CasaOS Mobile Pre-Release (Build ${{ github.run_number }})"
          
          # Creiamo la nuova release senza eliminare le precedenti per mantenere lo storico
          gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk \
            --title "$TITLE" \
            --notes "Autogenerated Beta build from commit ${{ github.sha }}" \
            --prerelease
