name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Pre-Release

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Determine Release Info
        id: release_info
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.release_type }}" == "Release" ]]; then
            echo "TAG_NAME=Release" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=CasaOS Reborn Mobile Stable Release" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=Pre-Release" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=CasaOS Reborn Mobile Pre-Release" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.TAG_NAME }}"
          TITLE="${{ steps.release_info.outputs.RELEASE_NAME }}"
          PRERELEASE="${{ steps.release_info.outputs.IS_PRERELEASE }}"
          
          echo "Deleting old release and tag if they exist..."
          gh release delete "$TAG" --cleanup-tag -y || true
          
          echo "Creating new tag and release..."
          if [ "$PRERELEASE" == "true" ]; then
            gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk --title "$TITLE" --notes "Build generata automaticamente dal commit ${{ github.sha }}" --prerelease
          else
            gh release create "$TAG" android/app/build/outputs/apk/release/app-release.apk --title "$TITLE" --notes "Build generata automaticamente dal commit ${{ github.sha }}"
          fi
